<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Lyapunov — Pick up where you left off.</title>
<desc id="desc">A stack of frosted-glass cards, one per activity; the Trip photos card is open with its applications and a Resume button.</desc>
<defs>
<clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc39a"/><stop offset=".55" stop-color="#f29bb8"/><stop offset="1" stop-color="#a98cf0"/></linearGradient>
<linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fdcf8"/><stop offset="1" stop-color="#6aa8f0"/></linearGradient>

<clipPath id="lg-t"><rect x="8" y="8" width="240" height="240" rx="58"/></clipPath>
<filter id="lg-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
<filter id="lg-lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#2a1e5c" flood-opacity=".22"/></filter>
