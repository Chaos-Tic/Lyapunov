<rect x="35" y="71" width="186" height="116" rx="19" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="2"/><rect x="33" y="69" width="190" height="120" rx="21" fill="none" stroke="url(#lg-film)" stroke-width="2.5"/><circle cx="62" cy="98" r="11" fill="#fff"/><rect x="82" y="92" width="80" height="11" rx="5.5" fill="#fff" fill-opacity=".95"/><rect x="54" y="148" width="104" height="26" rx="13" fill="#151820"/><path d="M99 154 l10 7 l-10 7 z" fill="#fff"/>
