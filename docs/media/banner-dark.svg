<linearGradient id="lg-film" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#78e0ff"/><stop offset=".3" stop-color="#aa96ff"/><stop offset=".55" stop-color="#ff96d6"/><stop offset=".8" stop-color="#ffd68c"/><stop offset="1" stop-color="#78e0ff"/></linearGradient>
</defs>
